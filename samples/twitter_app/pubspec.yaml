# samples/twitter_app/pubspec.yaml
name: twitter_app
description: Twitter-style sample exercising every InsForge Flutter SDK module.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  insforge_flutter: ^0.2.0
  flutter_riverpod: ^2.5.1
  url_launcher: ^6.3.0
  app_links: ^6.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
